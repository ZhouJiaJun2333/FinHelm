[project]
name = "finhelm"
version = "0.1.0"
description = "FinHelm：金融垂直领域的通用 Agent（学习用，从零手写）"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "openai>=1.60",
    "psycopg[binary]>=3.2",
    "pillow>=10",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# 文档检索（src/data_agent/rag）。torch 要按显卡另装 CUDA 版：pip install torch --index-url https://download.pytorch.org/whl/cu128
rag = ["pymupdf>=1.26", "numpy>=1.26", "sentence-transformers>=3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]   # "." 让测试能 import evals（判分器要有单元测试）
testpaths = ["tests"]
